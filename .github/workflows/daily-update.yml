name: Daily AI Trends Update

# 每天 UTC 0:00 (= 北京时间 8:00) 自动更新网站
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}  # 支持手动触发 (Actions 页面点 Run workflow)

permissions:
  contents: write  # 允许提交更新

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape trends (Google Trends + 12 verticals)
        run: python3 daily_trends.py --force

      - name: Build AI site
        run: python3 ai_build.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/ai/ai_daily.json
          git commit -m "📅 daily update $(date -u +%Y-%m-%d)" || echo "No changes today"
          git push
